    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e0f2f1; /* Light green background */
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.7); /* Slightly transparent white for glassmorphism */
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Background blur effect, mimicking the image */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(144, 238, 144, 0.4), rgba(173, 216, 230, 0.4)); /* Light green to light blue gradient */
            z-index: -1;
            filter: blur(50px);
            opacity: 0.6;
        }

        h1 {
            font-size: 2.5em;
            font-weight: 600;
            color: #4CAF50; /* Green */
            text-align: center;
            margin-bottom: 20px;
        }

        .button-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .button {
            background-color: #ffffff;
            color: #4CAF50;
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.0em;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .button:hover {
            background-color: #4CAF50;
            color: #ffffff;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        h2 {
            font-size: 1.4em;
            font-weight: 600;
            color: #555;
            margin-bottom: 15px;
        }

        .participant-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .participant-card {
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .participant-card img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #4CAF50;
        }

        .participant-info {
            flex-grow: 1;
        }

        .participant-info h3 {
            margin: 0;
            font-size: 1.1em;
            font-weight: 600;
            color: #333;
        }

        .participant-info p {
            margin: 2px 0 0;
            font-size: 0.9em;
            color: #777;
        }

        .footer-buttons {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            gap: 10px;
        }

        .footer-button {
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #555;
            font-size: 0.9em;
            font-weight: 600;
            flex: 1;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: background-color 0.3s ease;
        }

        .footer-button:hover {
            background-color: #e8f5e9; /* Lighter green */
        }

        .footer-button .icon {
            font-size: 1.8em;
            margin-bottom: 5px;
            color: #4CAF50;
        }

        .copyright {
            text-align: center;
            margin-top: 20px;
            font-size: 0.8em;
            color: #888;
        }
    </style>
